const modes = new Set(["english-only", "korean-only"]);
const buttons = Array.from(document.querySelectorAll("[data-mode]"));
let activeMode = "english-only";

function decodeBase64Utf8(value) {
  const binary = atob(value);
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index += 1) {
    bytes[index] = binary.charCodeAt(index);
  }
  return new TextDecoder("utf-8").decode(bytes);
}

function setMode(mode) {
  activeMode = activeMode === mode ? "" : mode;
  for (const item of modes) {
    document.body.classList.toggle(item, item === activeMode);
  }
  for (const button of buttons) {
    button.classList.toggle("active", button.dataset.mode === activeMode);
  }
}

document.getElementById("en-frame").srcdoc = decodeBase64Utf8(EN_HTML_B64);
document.getElementById("ko-frame").srcdoc = decodeBase64Utf8(KO_HTML_B64);
for (const button of buttons) {
  button.addEventListener("click", () => setMode(button.dataset.mode));
}
</script>
